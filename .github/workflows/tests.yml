name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Bash syntax
        run: |
          for f in install.sh lib/*.sh lib/modes/*.sh lang/*.sh tests/*.sh; do
            bash -n "$f"
          done

      - name: PHP syntax
        run: php -l config/panel-key.php

      - name: Unit tests
        run: bash tests/run.sh
